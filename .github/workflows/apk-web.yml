name: Build Saqr Web APK
on:
  push:
    paths: ['android-web/**', '.github/workflows/apk-web.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    if: github.repository == 'aboudalah-stack/saqr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        run: |
          set -o pipefail
          gradle -p android-web assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -A12 "What went wrong" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^e: |error:|AAPT|ERROR" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - run: cp android-web/app/build/outputs/apk/debug/app-debug.apk saqr.apk
      - uses: actions/upload-artifact@v4
        with: { name: saqr-apk, path: saqr.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: saqr-web-apk
          name: صقر - APK
          body: نزّل ملف saqr.apk وثبّته على التلفون. اللعبة تفتح بالعرض وبملء الشاشة.
          files: saqr.apk
          make_latest: false

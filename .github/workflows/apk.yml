name: Build APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    if: github.repository == 'aboudalah-stack/saqr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        run: |
          set -o pipefail
          gradle -p android assembleDebug bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -A12 "What went wrong" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^e: |error:|AAPT|ERROR" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk saqr-table.apk
          cp android/app/build/outputs/bundle/release/app-release.aab saqr-table-unsigned.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: طاولة الصقر - APK
          body: نزّل ملف saqr-table.apk وثبّته على التلفون.
          files: |
            saqr-table.apk
            saqr-table-unsigned.aab
          make_latest: true

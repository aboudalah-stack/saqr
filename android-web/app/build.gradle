plugins { id 'com.android.application' }
android {
  namespace 'com.saqr.web'
  compileSdk 35
  defaultConfig {
    applicationId 'com.saqr.poker'
    minSdk 21
    targetSdk 35
    versionCode 4
    versionName '1.3'
  }
  // Store builds are signed with the permanent Saqr Poker key (key comes from GitHub secrets, see .github/workflows/apk-release.yml)
  signingConfigs {
    release {
      if (System.getenv('SAQR_KS')) {
        storeFile file(System.getenv('SAQR_KS'))
        storePassword System.getenv('SAQR_KS_PASS')
        keyAlias 'saqr'
        keyPassword System.getenv('SAQR_KS_PASS')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      if (System.getenv('SAQR_KS')) signingConfig signingConfigs.release
    }
  }
  lint { checkReleaseBuilds false; abortOnError false }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
